name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: nektopushkin/devops-example-app
  BUILD_TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build once
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$BUILD_TAG" .
      - name: Test the image
        run: docker run --rm "$IMAGE:$BUILD_TAG" sh scripts/check.sh
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish and record release
        run: |
          docker push "$IMAGE:$BUILD_TAG"
          image_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$BUILD_TAG")
          test -n "$image_ref"
          printf 'commit=%s\nrelease_id=%s\nimage=%s\nref=%s\n' \
            "$GITHUB_SHA" "$GITHUB_SHA" "$image_ref" "$GITHUB_REF" > release.txt
          cat release.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.txt
          if-no-files-found: error